<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width" />
  <title>draggable</title>
  <style>
html, body {
  height: 100%;
  margin: 0px 0px 0px 0px;
  padding: 0px 0px 0px 0px;
  touch-action: none;
}

#mydiv {
  padding: 0px;
  margin: 0px;
  position: absolute;
  z-index: 9;
  background-color: transparent;
  border: none;
  text-align: center;
  font-size: 64px;
  line-height: 1em;
}

#mydivheader, #mydivface {
  padding: 0px;
  margin: 0px;
  cursor: move;
  z-index: 10;
  background-color: transparent;
}

#mydivface {
  display: none;
}
  </style>
</head>
<body>
  <h1>draggable</h1>
  <div id="test"></div>

<div id="mydiv">
  <div id="mydivheader">🂠</div>
  <div id="mydivface">🃟</div>
</div>

<!-- for deterministic language card game, shuffle by transfer function -->

  <script>

document.getElementById("mydiv").onclick = function(e) {
  if (document.getElementById("mydivheader").style.display != 'none') {
    document.getElementById("mydivheader").style.display = 'none';
    document.getElementById("mydivface").style.display = 'block';
  } else {
    document.getElementById("mydivheader").style.display = 'block';
    document.getElementById("mydivface").style.display = 'none';
  }
}


// Make the DIV element draggable:
dragElement(document.getElementById("mydiv"));

function dragElement(elmnt) {
  var pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
  if (document.getElementById(elmnt.id + "header")) {
    // if present, the header is where you move the DIV from:
    document.getElementById(elmnt.id + "header").onpointerdown = dragMouseDown;
  } else {
    // otherwise, move the DIV from anywhere inside the DIV: 
    elmnt.onpointerdown = dragMouseDown;
  }

  function dragMouseDown(e) {
    e = e || window.event;
    e.preventDefault();
    // get the mouse cursor position at startup:
    pos3 = e.clientX;
    pos4 = e.clientY;
    document.onpointerup = closeDragElement;
    // call a function whenever the cursor moves:
    document.onpointermove = elementDrag;
  }

  function elementDrag(e) {
    e = e || window.event;
    e.preventDefault();
    // calculate the new cursor position:
    pos1 = pos3 - e.clientX;
    pos2 = pos4 - e.clientY;
    pos3 = e.clientX;
    pos4 = e.clientY;
    // set the element's new position:
    elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
    elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
  }

  function closeDragElement() {
    // stop moving when mouse button is released:
    document.onpointerup = null;
    document.onpointermove = null;
  }
}

  </script>
</body>
</html>
